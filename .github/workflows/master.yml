name: CI

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Least privilege by default; the docs job raises it for the Pages publish only.
permissions:
  contents: read

# A push to a feature branch and its pull request share one group, so a newer run cancels the older one.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   cc: gcc,   cxx: g++,     preset: ci }
          - { compiler: clang, cc: clang, cxx: clang++, preset: ci }
          - { compiler: gcc,   cc: gcc,   cxx: g++,     preset: asan }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -j 2

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov
      - run: cmake --preset coverage
      - run: cmake --build --preset coverage -j
      - run: ctest --preset coverage -j 2
      - name: Collect coverage
        run: |
          lcov --capture --directory build/coverage --output-file coverage.info --ignore-errors mismatch,gcov,inconsistent,negative,unused,empty
          lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/Testing/*' --output-file coverage.info --ignore-errors unused,inconsistent,empty
          lcov --list coverage.info --ignore-errors inconsistent,empty | tail -5
      - uses: actions/upload-artifact@v4
        with: { name: coverage-info, path: coverage.info, retention-days: 14 }

  e2e-console:
    name: End-to-end console scenario
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        timeout-minutes: 20
        run: |
          # Runner downloads occasionally hang: bound every attempt and retry.
          retry() { for n in 1 2 3; do timeout 300 "$@" && return 0; echo "attempt $n failed or timed out: $*"; sleep 5; done; return 1; }
          retry sudo apt-get update
          retry sudo apt-get install -y ninja-build
          retry pip install playwright imageio-ffmpeg
          # static ffmpeg from the wheel (avoids a 100-package apt download that stalls on the runner mirror)
          mkdir -p "$HOME/bin"
          ln -sf "$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          retry sudo -E env "PATH=$PATH" python3 -m playwright install-deps chromium
          retry python3 -m playwright install chromium ffmpeg
      - run: cmake --preset release
      - run: cmake --build --preset release -j
      - name: Run the platform and the browser scenario
        run: |
          mkdir -p out
          build/release/App/dashboard/ap_dashboard --port 8099 --data-dir "$RUNNER_TEMP/ap" > out/dashboard.log 2>&1 &
          sleep 2
          python3 Tools/demo/record_demo.py --url http://127.0.0.1:8099 --out out --video
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- dashboard.log"; cat out/dashboard.log || true
          echo "--- overview"; curl -s http://127.0.0.1:8099/api/overview | head -c 3000 || true
          echo "--- EM logs"; for f in build/release/App/processes/redirected/*.txt; do echo "## $f"; tail -n 30 "$f"; done || true
          echo "--- processes"; ps aux | grep -E "Adaptive|ap_dash|sm_process|ota|UCM|SD" | grep -v grep || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-demo
          path: out/
          retention-days: 14

  docs:
    name: Doxygen documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate the documentation
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen graphviz
          doxygen doxygen.conf
      - name: Build the site (landing page, conformance reports, API reference)
        run: |
          pip install markdown
          python3 Tools/site/build_site.py --out site --api doc/html
      - name: Publish to GitHub Pages (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'update the documentation'
