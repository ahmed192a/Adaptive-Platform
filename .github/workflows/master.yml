name: CI

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   cc: gcc,   cxx: g++,     preset: ci }
          - { compiler: clang, cc: clang, cxx: clang++, preset: ci }
          - { compiler: gcc,   cc: gcc,   cxx: g++,     preset: asan }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -j 2

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov
      - run: cmake --preset coverage
      - run: cmake --build --preset coverage -j
      - run: ctest --preset coverage -j 2
      - name: Collect coverage
        run: |
          lcov --capture --directory build/coverage --output-file coverage.info --ignore-errors mismatch,gcov
          lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/Testing/*' --output-file coverage.info
          lcov --list coverage.info | tail -5
      - uses: actions/upload-artifact@v4
        with: { name: coverage-info, path: coverage.info }

  e2e-console:
    name: End-to-end console scenario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build ffmpeg
          pip install playwright
      - run: cmake --preset release
      - run: cmake --build --preset release -j
      - name: Run the platform and the browser scenario
        run: |
          mkdir -p out
          build/release/App/dashboard/ap_dashboard --port 8099 --data-dir "$RUNNER_TEMP/ap" > out/dashboard.log 2>&1 &
          sleep 2
          python3 Tools/demo/record_demo.py --url http://127.0.0.1:8099 --out out --video
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-demo
          path: out/

  docs:
    name: Doxygen documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate the documentation
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen graphviz
          doxygen doxygen.conf
      - name: Publish to GitHub Pages (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/doc/html
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'update the documentation'
